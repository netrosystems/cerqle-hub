; ─────────────────────────────────────────────────────────────────────────────
; Supervisor configuration for Cerqle queue workers.
;
; One program per named queue, each with its own concurrency.
; Place this file in /etc/supervisor/conf.d/cerqle.conf and run:
;   supervisorctl reread && supervisorctl update
; ─────────────────────────────────────────────────────────────────────────────

[program:cerqle-queue-default]
command=php /var/www/html/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cerqle-default.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:cerqle-queue-whatsapp]
command=php /var/www/html/artisan queue:work redis --queue=whatsapp --sleep=2 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=3
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cerqle-whatsapp.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:cerqle-queue-broadcast]
command=php /var/www/html/artisan queue:work redis --queue=broadcast --sleep=3 --tries=2 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cerqle-broadcast.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:cerqle-queue-ai]
command=php /var/www/html/artisan queue:work redis --queue=ai --sleep=3 --tries=3 --max-time=600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cerqle-ai.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:cerqle-queue-social]
command=php /var/www/html/artisan queue:work redis --queue=social --sleep=5 --tries=0 --timeout=1900 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
stopwaitsecs=1950
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cerqle-social.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:cerqle-queue-leads]
command=php /var/www/html/artisan queue:work redis --queue=leads --sleep=5 --tries=2 --max-time=1800
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=1
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cerqle-leads.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:cerqle-queue-automation]
command=php /var/www/html/artisan queue:work redis --queue=automation --sleep=3 --tries=3 --max-time=1800
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cerqle-automation.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[group:cerqle-queues]
programs=cerqle-queue-default,cerqle-queue-whatsapp,cerqle-queue-broadcast,cerqle-queue-ai,cerqle-queue-social,cerqle-queue-leads,cerqle-queue-automation
